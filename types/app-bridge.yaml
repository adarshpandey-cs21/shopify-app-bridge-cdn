AppBridge:
  PickedResourceVariant:
    description: A product variant included in a picked resource.
    type: object
    required:
      - id
    properties:
      id:
        type: string
      title:
        type: string
  PickedResource:
    description: A resource returned by the Shopify App Bridge resource picker.
    type: object
    required:
      - id
      - title
    properties:
      id:
        type: string
      title:
        type: string
      variants:
        type: array
        description:
          Variants of the picked product. Present when the picked resource is a product;
          contains only the variants the merchant selected. Compare its length with
          totalVariants to tell a narrowed selection from a whole-product selection.
        items:
          $ref: './types/app-bridge.yaml#/AppBridge/PickedResourceVariant'
      totalVariants:
        type: number
        description: How many variants the picked product has in total.
  ResourcePickerResult:
    description: The result returned by the Shopify App Bridge resource picker.
    type: object
    properties:
      selection:
        type: array
        description: The selected resources.
        items:
          $ref: './types/app-bridge.yaml#/AppBridge/PickedResource'
